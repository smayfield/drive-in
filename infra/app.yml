AWSTemplateFormatVersion: "2010-09-09"
Description: >
  drive-in.online app: one small ARM EC2 server running the stack in Docker
  (Caddy, Blazor web app, PostgreSQL, EF Core migration bundle), with ECR image
  repos, an ops bucket for deploy files and DB backups, daily EBS snapshots,
  container logs in CloudWatch Logs, Route 53 records, an SNS alerts topic with CloudWatch alarms, and a GitHub
  Actions OIDC deploy role. Deploy in us-east-1.

Parameters:
  DomainName:
    Type: String
    Default: drive-in.online
  ServeApex:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      true = the apex, www and app.<domain> point at the server (www and app redirect
      to the apex). false = only app.<domain> does, for staging a server without taking
      over the domain. Also tells deploy.sh which Caddyfile to use, so redeploy the app
      after changing it.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  GitHubSub:
    Type: String
    Default: repo:smayfield@1933107/drive-in@1388283268:ref:refs/heads/main
    Description: >
      OIDC subject allowed to deploy (main branch only). This repo uses GitHub's
      immutable subject format; see
      `gh api repos/smayfield/drive-in/actions/oidc/customization/sub`.
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Where alerts are emailed (CloudWatch alarms and Grafana, through the SNS topic). Confirm
      the subscription from the email SNS sends. Blank = no subscription.

Conditions:
  Live: !Equals [!Ref ServeApex, "true"]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------- Network: one public subnet, no NAT ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.41.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: drive-in }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.41.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: drive-in-public }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Drive-In web (HTTP/HTTPS only; admin via SSM Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  # ---------- Storage ----------
  OpsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # Versioned, so a deleted or overwritten backup (say, by someone who got onto the server) can be recovered for
      # 14 days.
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-backups, Status: Enabled, Prefix: backups/, ExpirationInDays: 30 }
          - { Id: expire-deploy-files, Status: Enabled, Prefix: deploy/, ExpirationInDays: 30 }
          # pitr/ (pgBackRest's base backups and WAL) has no expiry rule: pgBackRest expires it itself, keeping every
          # WAL file the backups it keeps need. A rule here could break that chain.
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }

  EcrWeb:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: drive-in-web
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
  EcrMigrate:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: drive-in-migrate
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
  # PostgreSQL with pgBackRest (deploy/postgres/Dockerfile), tagged by its Dockerfile's hash; few tags, rarely added.
  EcrPostgres:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: drive-in-postgres
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

  # Every container's console output (docker's awslogs driver; deploy/docker-compose.prod.yml), one stream per
  # container. Kept a month: long enough to look into an incident, cheap at this volume ($0.50/GB ingested).
  ContainerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /drive-in/containers
      RetentionInDays: 30

  # ---------- Image CDN: public theaters' images at img.<domain> (S3 + CloudFront) ----------
  # The app copies live theaters' logos, posters and page images here (PublicImagePublisher) and redirects their URLs
  # to the copies, so image bytes don't go through the server. Private: only CloudFront reads it (origin access
  # control). Versioned, so a deleted copy can be recovered for 30 days (the database has every image anyway).
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
  ImagesOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-images
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  # In us-east-1, as CloudFront requires; validated through the Route 53 zone, so it needs no manual step.
  ImagesCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub img.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub img.${DomainName}
          HostedZoneId: !ImportValue drive-in-HostedZoneId
  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: drive-in.online public theater images
        Aliases: [!Sub "img.${DomainName}"]
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe edges only: the cheapest class, and where the customers are.
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref ImagesCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: images
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: images
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingOptimized, and SecurityHeadersPolicy (nosniff, HSTS, frame and referrer headers).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${ImagesBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImagesDistribution}
  ImagesRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue drive-in-HostedZoneId
      Name: !Sub img.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt ImagesDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's, the same for every distribution
  ImagesRecordV6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue drive-in-HostedZoneId
      Name: !Sub img.${DomainName}
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ImagesDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  # Read by deploy.sh for the app's PublicImages settings.
  ImagesBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /drive-in/images-bucket
      Type: String
      Value: !Ref ImagesBucket
  ImagesUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /drive-in/images-url
      Type: String
      Value: !Sub https://img.${DomainName}/
  ImagesDistributionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /drive-in/images-distribution-id
      Type: String
      Value: !Ref ImagesDistribution

  # Read by deploy.sh to choose Caddyfile.live or Caddyfile.staging.
  ServeApexParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /drive-in/serve-apex
      Type: String
      Value: !Ref ServeApex

  # ---------- Server ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: drive-in-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: drive-in-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/drive-in/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${OpsBucket.Arn}/deploy/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt OpsBucket.Arn
                Condition: { StringLike: { "s3:prefix": "deploy/*" } }
              # Nightly pg_dump and Data Protection keys (backup.sh); read back by restore.sh.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${OpsBucket.Arn}/backups/*
              # pgBackRest's repository (WAL archive and base backups). It deletes what it expires itself.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub ${OpsBucket.Arn}/pitr/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt OpsBucket.Arn
                Condition: { StringLike: { "s3:prefix": ["backups/*", "pitr", "pitr/*"] } }
              # Docker (the daemon, with the instance role) ships container logs to the log group.
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ContainerLogs}:log-stream:*
              # Grafana sends alerts to the alerts topic with the instance role (no stored keys).
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic
              # The web app copies public theaters' images to the image CDN's bucket and removes them (PublicImages.cs).
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${ImagesBucket.Arn}/t/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ImagesBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImagesDistribution}
              # The web container sends account and invite emails through SES (see email.yml).
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}
                Condition:
                  StringLike: { "ses:FromAddress": !Sub "*@${DomainName}" }
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  Server:
    Type: AWS::EC2::Instance
    Properties:
      # A fixed image, in the template rather than a parameter. It used to follow the "latest Amazon Linux" SSM
      # parameter, which CloudFormation re-resolves on every update; on 2026-10-01 a newer image replaced the server
      # (a fresh, empty disk). A parameter would keep its previous value on `cloudformation deploy`, so changing its
      # default wouldn't take effect; here, changing the image is a reviewed template change. Upgrade deliberately:
      # see the README.
      ImageId: ami-065b1b834d2a83a7a # Amazon Linux 2023 arm64, launched 2026-10-01
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSg]
      PropagateTagsToVolumeOnCreation: true
      # Hop limit 2 lets containers reach IMDSv2 for the instance role (SES credentials).
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false }
      Tags:
        - { Key: Name, Value: drive-in }
        - { Key: Backup, Value: drive-in }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -fsSL -o /usr/libexec/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          systemctl enable --now docker
          # 2 GB swap as headroom for the .NET app plus PostgreSQL
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          fi
          swapon -a
          mkdir -p /opt/drive-in

  ServerIp:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{ Key: Name, Value: drive-in }]

  # ---------- Alerts: SNS email, plus CloudWatch alarms for what Grafana can't see ----------
  # Grafana runs on this server, so it can't report the server itself dying; these alarms can.
  # All within the free tier (10 alarms, 1,000 SNS emails a month).
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: drive-in-alerts
      DisplayName: Drive-In alerts
  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  # Read by deploy.sh for Grafana's contact point.
  AlertsTopicParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /drive-in/alerts-topic-arn
      Type: String
      Value: !Ref AlertsTopic

  # The host failed (hardware, network): EC2 moves the instance to healthy hardware, keeping its disk and IP.
  SystemStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: drive-in-system-status
      AlarmDescription: The drive-in server's host failed its status check; EC2 is recovering it.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub arn:aws:automate:${AWS::Region}:ec2:recover
        - !Ref AlertsTopic
      OKActions: [!Ref AlertsTopic]
  # The OS is hung or out of memory. Needs a reboot or a look over SSM.
  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: drive-in-instance-status
      AlarmDescription: The drive-in server failed its instance status check (hung, out of memory, or not booting).
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: drive-in-cpu-high
      AlarmDescription: The drive-in server's CPU has been above 90% for 15 minutes.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]
  # t4g instances run "unlimited": sustained CPU beyond the earned credits is billed. Any charge is worth knowing about.
  CpuSurplusChargedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: drive-in-cpu-surplus-charged
      AlarmDescription: The drive-in server is being billed for surplus CPU credits (sustained CPU above its baseline).
      Namespace: AWS/EC2
      MetricName: CPUSurplusCreditsCharged
      Dimensions: [{ Name: InstanceId, Value: !Ref Server }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]

  # ---------- DNS ----------
  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue drive-in-HostedZoneId
      Name: !Sub app.${DomainName}
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]
  # The apex and www. Only when live, so a staging server doesn't take over the domain.
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: Live
    Properties:
      HostedZoneId: !ImportValue drive-in-HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: Live
    Properties:
      HostedZoneId: !ImportValue drive-in-HostedZoneId
      Name: !Sub www.${DomainName}
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]

  # ---------- Daily EBS snapshots (keep 7) ----------
  DlmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole
  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshots of the Drive-In server disk
      State: ENABLED
      ExecutionRoleArn: !GetAtt DlmRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Backup, Value: drive-in }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["08:00"] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # ---------- GitHub Actions deploy role ----------
  # The account's GitHub OIDC provider is owned by the magicworld-site stack.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: drive-in-app-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSub
      Policies:
        - PolicyName: deploy-drive-in
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt EcrWeb.Arn
                  - !GetAtt EcrMigrate.Arn
                  - !GetAtt EcrPostgres.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${OpsBucket.Arn}/deploy/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  InstanceId:
    Value: !Ref Server
  PublicIp:
    Value: !Ref ServerIp
  OpsBucket:
    Value: !Ref OpsBucket
  EcrRegistry:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  ImagesUrl:
    Value: !Sub https://img.${DomainName}/
  ImagesDistributionId:
    Value: !Ref ImagesDistribution
  ContainerLogGroup:
    Value: !Ref ContainerLogs
