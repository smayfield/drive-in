# Production stack for drive-in.online, run on the EC2 server by deploy.sh.
# Variables (REGISTRY, TAG, PG_TAG, OPS_BUCKET, DB_PASSWORD, GOOGLE_*, ADMIN_EMAIL, GEOCODING_CONTACT_EMAIL, PUBLIC_HOST,
# GRAFANA_*, ALERTS_TOPIC_ARN) come from the .env file deploy.sh writes from SSM Parameter Store. Local development uses the
# docker-compose.yml at the repo root.
name: drive-in

# Console output goes to CloudWatch Logs (log group /drive-in/containers, kept 30 days; infra/app.yml), one stream per
# container, so it outlives the container. Docker keeps a local copy too ("dual logging"), so `docker compose logs`
# still works. Non-blocking: if CloudWatch can't be reached, lines are buffered (then dropped) rather than stalling the app.
x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: us-east-1
    awslogs-group: /drive-in/containers
    tag: "{{.Name}}/{{.ID}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  caddy:
    image: caddy:2
    logging: *awslogs
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      edge:
        # Fixed so Grafana trusts its auth-proxy header from Caddy only (GF_AUTH_PROXY_WHITELIST).
        ipv4_address: 172.30.0.10

  web:
    image: ${REGISTRY}/drive-in-web:${TAG}
    logging: *awslogs
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Database=drivein;Username=drivein;Password=${DB_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      DataProtection__KeysPath: /keys
      Seed__AdminEmail: ${ADMIN_EMAIL}
      # Sent to OpenStreetMap's Nominatim in the User-Agent, as its usage policy asks. Optional.
      Geocoding__ContactEmail: ${GEOCODING_CONTACT_EMAIL:-}
      Email__Provider: Ses
      # Business and performance metrics, pushed to VictoriaMetrics (Grafana at /grafana/).
      Metrics__OtlpEndpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
      # Trust X-Forwarded-* only from the edge network (Caddy); must match its subnet below.
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
      # SES credentials come from the EC2 instance role (IMDS hop limit is 2 for containers).
      AWS_REGION: us-east-1
    volumes:
      - dpkeys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - edge

  # PostgreSQL with pgBackRest (deploy/postgres/Dockerfile). Every finished WAL segment is pushed to
  # s3://<OpsBucket>/pitr/, and at least once a minute while anything is written (archive_timeout), so a restore can stop
  # at any moment up to about a minute ago. backup.sh takes the base backups. Restores: deploy/restore.sh and the README.
  postgres:
    image: ${REGISTRY}/drive-in-postgres:${PG_TAG}
    logging: *awslogs
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_DB: drivein
      POSTGRES_USER: drivein
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGBACKREST_STANZA: drivein
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_USER: drivein
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_PATH: /pitr
      PGBACKREST_REPO1_S3_BUCKET: ${OPS_BUCKET}
      PGBACKREST_REPO1_S3_ENDPOINT: s3.us-east-1.amazonaws.com
      PGBACKREST_REPO1_S3_REGION: us-east-1
      # The EC2 instance role, through IMDSv2 (hop limit 2 for containers). No stored keys.
      PGBACKREST_REPO1_S3_KEY_TYPE: auto
      # Four weekly full backups (about four weeks of point-in-time recovery); daily differentials in between.
      PGBACKREST_REPO1_RETENTION_FULL: "4"
      PGBACKREST_COMPRESS_TYPE: zst
      # If S3 can't be reached, WAL piles up in pg_wal and the "WAL archiving failing" alert fires. Past 2 GB pgBackRest
      # drops it (point-in-time recovery has a gap until the next base backup) rather than fill the disk and stop the
      # database.
      PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: 2GiB
      # Warnings and errors only (each archived segment would otherwise log two lines). backup.sh asks for info.
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
      PGBACKREST_LOG_LEVEL_STDERR: "off"
      PGBACKREST_LOG_LEVEL_FILE: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivein -d drivein"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Monitoring (admin-only Grafana at /grafana/; nothing here publishes a public port) ----------

  # Time-series database. Scrapes the exporters and Caddy (victoriametrics/scrape.yml); the app pushes OTLP to it.
  # Bound to the host's loopback too, so backup.sh can record its last success.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    logging: *awslogs
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=13 # months
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -opentelemetry.usePrometheusNaming
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vmdata:/storage
      - ./victoriametrics:/etc/victoriametrics:ro
    mem_limit: 256m
    networks:
      - default
      - edge

  # Signed in through the app: Caddy asks /ops/grafana-auth, which only admits site admins, and passes their
  # email in X-WEBAUTH-USER. Everything (data sources, dashboards, alerts) is provisioned from ./grafana.
  grafana:
    image: grafana/grafana-oss:13.0.2
    logging: *awslogs
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 172.30.0.10
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      # The seeded admin is also Grafana's server admin. Its password is never used (no login form or basic auth).
      GF_SECURITY_ADMIN_USER: ${ADMIN_EMAIL}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Only the bundled data sources are used; skip downloading plugins at startup.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Read by the provisioning files.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      ALERTS_TOPIC_ARN: ${ALERTS_TOPIC_ARN}
      # The SNS contact point signs with the EC2 instance role (IMDS hop limit is 2 for containers).
      AWS_REGION: us-east-1
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    mem_limit: 320m
    depends_on:
      - victoriametrics
    networks:
      - default
      - edge

  # Host CPU, memory, swap and disk (the host's /proc and / are mounted read-only).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.diskstats
      - --collector.pressure
      - --collector.stat
      - --collector.uname
      - --collector.time
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 48m

  # Postgres connections, size and activity, as the read-only grafana_ro role (granted pg_monitor; grafana-ro.sql).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/drivein?sslmode=disable
      DATA_SOURCE_USER: grafana_ro
      DATA_SOURCE_PASS: ${GRAFANA_DB_PASSWORD}
    mem_limit: 48m
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot EF Core migration bundle; run explicitly by deploy.sh before the app restarts.
  migrate:
    image: ${REGISTRY}/drive-in-migrate:${TAG}
    logging: *awslogs
    profiles: ["migrate"]
    command:
      - --connection
      - Host=postgres;Database=drivein;Username=drivein;Password=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
  vmdata:
  grafanadata:

networks:
  # Caddy <-> web. Fixed subnet so the web app can trust forwarded headers from it only.
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
