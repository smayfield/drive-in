# Alerts go to the drive-in-alerts SNS topic (infra/app.yml), which emails its subscribers. Grafana signs the
# request with the EC2 instance role, so no AWS keys are stored.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: SNS email
    receivers:
      - uid: sns-email
        type: sns
        settings:
          topic_arn: $ALERTS_TOPIC_ARN
          sigv4:
            region: us-east-1
          subject: '[Drive-In] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
          message: |
            {{ range .Alerts -}}
            {{ .Status | toUpper }}: {{ .Labels.alertname }}
            {{ with .Annotations.summary }}{{ . }}{{ end }}
            {{ with .Annotations.description }}{{ . }}{{ end }}
            Since: {{ .StartsAt.Format "2006-01-02 15:04 MST" }}
            {{ with .GeneratorURL }}Rule: {{ . }}{{ end }}

            {{ end -}}

policies:
  - orgId: 1
    receiver: SNS email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
